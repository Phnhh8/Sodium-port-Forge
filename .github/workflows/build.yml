name: Build Sodium Port Forge 1.20.1

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Tải mã nguồn port Sodium cho Forge 1.20.1 từ org chính thức embeddedt
      - name: Checkout Sodium Forge 1.20.1 Source
        uses: actions/checkout@v4
        with:
          repository: embeddedt/embeddium
          ref: 1.20.1/dev

      # 2. Cài đặt Java 17 chuẩn Minecraft 1.20.1
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Biên dịch ra file .jar hoàn chỉnh (đã remap SRG + Mixin Manifest)
      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      # 4. Đóng gói file .jar thành phẩm để tải về
      - name: Upload Jar
        uses: actions/upload-artifact@v4
        with:
          name: sodium-forge-1.20.1-working
          path: build/libs/*.jar

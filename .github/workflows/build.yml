name: Build Forge 1.20.1

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Forge Port Files
        uses: actions/checkout@v4
        with:
          path: port-files

      - name: Checkout Official Sodium 1.20.1 Source
        uses: actions/checkout@v4
        with:
          repository: CaffeineMC/sodium
          ref: mc1.20.1-0.5.8
          path: sodium-base

      - name: Merge and Patch Forge 1.20.1
        run: |
          cp -rn sodium-base/* .
          cp -rn sodium-base/.[!.]* . 2>/dev/null || true
          cp -rf port-files/forge ./
          
          # Xóa file .kts cũ của 1.21 và tạo forge/build.gradle chuẩn cho nhánh mc1.20.1-0.5.8
          rm -f forge/build.gradle.kts
          cat << 'EOF' > forge/build.gradle
          plugins {
              id 'java-library'
          }

          java {
              toolchain {
                  languageVersion = JavaLanguageVersion.of(17)
              }
          }

          repositories {
              mavenCentral()
              maven { url = 'https://minecraftforge.net' }
              maven { url = 'https://spongepowered.org' }
          }

          dependencies {
              implementation rootProject
              compileOnly 'org.spongepowered:mixin:0.8.5'
          }
          EOF

          # Nối thêm module :forge vào settings.gradle gốc
          if [ -f settings.gradle.kts ]; then
            echo "" >> settings.gradle.kts
            echo 'include(":forge")' >> settings.gradle.kts
          elif [ -f settings.gradle ]; then
            echo "" >> settings.gradle
            echo "include ':forge'" >> settings.gradle
          fi

          rm -rf port-files sodium-base

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew :forge:build --stacktrace

      - name: Upload Jar
        uses: actions/upload-artifact@v4
        with:
          name: sodium-forge-1.20.1
          path: forge/build/libs/*.jar

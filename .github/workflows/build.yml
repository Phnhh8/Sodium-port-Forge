name: Build Forge 1.20.1

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Forge Port Files
        uses: actions/checkout@v4
        with:
          path: port-files

      - name: Checkout Official Sodium 1.20.1 Source
        uses: actions/checkout@v4
        with:
          repository: CaffeineMC/sodium
          ref: mc1.20.1-0.5.8
          path: sodium-base

      - name: Merge and Patch Forge 1.20.1
        run: |
          cp -rn sodium-base/* .
          cp -rn sodium-base/.[!.]* . 2>/dev/null || true
          cp -rf port-files/forge ./
          
          # 1. Tạo forge/build.gradle chuẩn Gradle 8.5 (bỏ dòng configurations.compileClasspath)
          rm -f forge/build.gradle.kts
          cat << 'EOF' > forge/build.gradle
          plugins {
              id 'java-library'
          }

          java {
              toolchain {
                  languageVersion = JavaLanguageVersion.of(17)
              }
          }

          repositories {
              mavenCentral()
              maven { url = uri("https://" + "maven.fabricmc.net/") }
              maven { url = uri("https://" + "maven.minecraftforge.net/") }
          }

          dependencies {
              implementation rootProject
              compileOnly 'net.fabricmc:sponge-mixin:0.12.5+mixin.0.8.5'
              compileOnly 'net.minecraftforge:fmlcore:1.20.1-47.2.0'
              compileOnly 'net.minecraftforge:javafmllanguage:1.20.1-47.2.0'
              compileOnly 'net.minecraftforge:fmlloader:1.20.1-47.2.0'
          }

          tasks.withType(Jar).configureEach {
              archiveBaseName.set('sodium-forge-1.20.1')
              from(rootProject.sourceSets.main.output)
              from(rootProject.sourceSets.api.output)
              duplicatesStrategy = DuplicatesStrategy.EXCLUDE
          }
          EOF

          # 2. Cập nhật SodiumForgeMod.java khớp với package me.jellysquid.mods.sodium của bản 0.5.8
          rm -rf forge/src/main/java/net
          mkdir -p forge/src/main/java/me/jellysquid/mods/sodium/forge
          cat << 'EOF' > forge/src/main/java/me/jellysquid/mods/sodium/forge/SodiumForgeMod.java
          package me.jellysquid.mods.sodium.forge;

          import me.jellysquid.mods.sodium.client.SodiumClientMod;
          import net.minecraftforge.api.distmarker.Dist;
          import net.minecraftforge.fml.common.Mod;
          import net.minecraftforge.fml.loading.FMLEnvironment;

          @Mod("sodium")
          public class SodiumForgeMod {
              public SodiumForgeMod() {
                  if (FMLEnvironment.dist == Dist.CLIENT) {
                      SodiumClientMod.logger().info("Loaded Sodium Forge 1.20.1 Port!");
                  }
              }
          }
          EOF

          # 3. Cập nhật mixins json khớp package me.jellysquid
          cat << 'EOF' > forge/src/main/resources/sodium-forge.mixins.json
          {
            "required": true,
            "minVersion": "0.8.5",
            "package": "me.jellysquid.mods.sodium.forge.mixin",
            "compatibilityLevel": "JAVA_17",
            "client": [],
            "injectors": {
              "defaultRequire": 1
            }
          }
          EOF

          # 4. Nối thêm module :forge vào settings.gradle gốc
          if [ -f settings.gradle.kts ]; then
            echo "" >> settings.gradle.kts
            echo 'include(":forge")' >> settings.gradle.kts
          elif [ -f settings.gradle ]; then
            echo "" >> settings.gradle
            echo "include ':forge'" >> settings.gradle
          fi

          rm -rf port-files sodium-base

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew :forge:build --stacktrace

      - name: Upload Jar
        uses: actions/upload-artifact@v4
        with:
          name: sodium-forge-1.20.1
          path: forge/build/libs/*.jar
